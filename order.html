<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mos Burger </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <Link rel="stylesheet" href="/css/order.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-light bg-white">
    <div class="container d-flex justify-content-between align-items-center flex-wrap">
      <div class="navbar-brand d-flex align-items-center">
        <img src="/Assets/hOME AND LOGIN IMAGES/mos burger ai.jpg" alt="Logo" height="50" />
        <span class="ms-2 fw-bold">MOS BURGER</span>
      </div>

      <div class="d-flex align-items-center flex-wrap">
        <div class="nav-links me-3 flex-wrap">
          <a href="./index.html" class="nav-link d-inline-block active">Home</a>
          <a href="./order.html" class="nav-link d-inline-block">Menu</a>
          <a href="./About.html" class="nav-link d-inline-block">About</a>
          <a href="./Contact.html" class="nav-link d-inline-block">Contact</a>
        </div>
        <a href="/login.html" class="login-icon-btn">
          <i class="fa-solid fa-user fa-lg" aria-label="Login Icon"></i>
        </a>
      </div>
    </div>
  </nav>

    <!-- Main Content -->
    <div class="main-container">
        <div class="row h-100">
            <!-- Menu Section -->
            <div class="col-8">
                <div class="menu-section p-3">
                    <!-- Category Buttons -->
                    <div class="d-flex justify-content-center mb-3">
                        <button class="category-btn active" data-category="all">
                            <i class="fas fa-th me-1"></i>All
                        </button>
                        <button class="category-btn" data-category="burgers">
                            <i class="fas fa-hamburger me-1"></i>Burgers
                        </button>
                        <button class="category-btn" data-category="sides">
                            <i class="fas fa-drumstick-bite me-1"></i>Sides
                        </button>
                        <button class="category-btn" data-category="drinks">
                            <i class="fas fa-coffee me-1"></i>Drinks
                        </button>
                        <button class="category-btn" data-category="desserts">
                            <i class="fas fa-ice-cream me-1"></i>Desserts
                        </button>
                    </div>

                    <!-- Search Bar -->
                    <div class="mb-3">
                        <input type="text" class="form-control search-bar" placeholder="Search menu items..." id="searchInput">
                    </div>

                    <!-- Menu Items -->
                    <div class="menu-items-container">
                        <div class="row" id="menuItems">
                            <!-- Menu items will be populated by JavaScript -->
                            
                        </div>
                    </div>
                </div>
            </div>

            <!-- Order Section -->
            <div class="col-4">
                <div class="order-section p-3">
                    <h5 class="fw-bold mb-3">Order Details</h5>
                    
                    <!-- Order Content -->
                    <div class="order-details-container">
                        <!-- Order ID and Date -->
                        <div class="mb-3">
                            <div class="d-flex justify-content-between">
                                <span class="fw-semibold">Order ID:</span>
                                <span id="orderId">OR#0008</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span class="fw-semibold">Date:</span>
                                <span id="orderDate"></span>
                            </div>
                        </div>

                        <hr>

                        <!-- Customer Information -->
                        <div class="mb-3">
                            <h6 class="fw-bold">Customer Information 
                                <i class="fas fa-user" onclick="showCustomerForm()"></i>
                            </h6>
                            <div class="mb-2">
                                <input type="text" class="form-control customer-input" placeholder="Enter Phone Number">
                            </div>
                            <div class="mb-2">
                                <input type="text" class="form-control customer-input" placeholder="Customer Name">
                            </div>
                            <div class="mb-2">
                                <input type="email" class="form-control customer-input" placeholder="Customer Email">
                            </div>
                        </div>

                        <hr>

                        <!-- Selected Items -->
                        <div id="selectedItems">
                            <!-- Selected items will appear here -->
                        </div>
                    </div>

                    <!-- Total -->
                    <div class="mt-auto">
                        <hr>
                        <div class="d-flex justify-content-between fs-5 fw-bold">
                            <span>Total:</span>
                            <span id="totalAmount">LKR 0.00</span>
                        </div>
                        <button class="checkout-btn" onclick="processCheckout()">
                            <i class="fas fa-shopping-cart me-2"></i>Checkout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script src="/js/order.js"></script>
</body>
</html>
