<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mos Burger</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/order.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-shop text-warning fs-3 me-2"></i>
                <strong><span>Mos Burger</span></strong>
                
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- Navigation Links -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link fw-semibold text-dark px-3" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold text-dark px-3" href="customerManagement.html">Customers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold text-dark px-3" href="placeOrder.html">Orders</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold text-dark px-3" href="storeManagement.html">Store</a>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-danger rounded-pill px-4 ms-2"
                                onclick="window.location.href='login.html'">
                            <i class="bi bi-box-arrow-left me-1"></i>Logout
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- Main Content -->
    <div class="main-container">
        <div class="row h-100">
            <!-- Menu Section -->
            <div class="col-8">
                <div class="menu-section p-3">
                    <!-- Category Buttons -->
                    <div class="d-flex justify-content-center mb-3">
                        <button class="category-btn active" data-category="all">
                            <i class="fas fa-list me-1"></i>All
                        </button>
                        <button class="category-btn" data-category="burgers">
                            <i class="fas fa-hamburger me-1"></i>Burgers
                        </button>
                        <button class="category-btn" data-category="sides">
                            <i class="fas fa-drumstick-bite me-1"></i>Sides
                        </button>
                        <button class="category-btn" data-category="drinks">
                            <i class="fas fa-coffee me-1"></i>Drinks
                        </button>
                        <button class="category-btn" data-category="desserts">
                            <i class="fas fa-ice-cream me-1"></i>Desserts
                        </button>
                    </div>
                    <!-- Search Bar -->
                    <div class="mb-3">
                        <input type="text" class="form-control search-bar" placeholder="Search menu items..." id="searchInput">
                    </div>
                    <!-- Menu Items -->
                    <div class="menu-items-container">
                        <div class="row" id="menuItems">
                            <!-- Menu items will be populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
            <!-- Order Section -->
            <div class="col-4">
                <div class="order-section p-3">
                    <h5 class="fw-bold mb-3">Order Details</h5>
                  
                    <!-- Order Content -->
                    <div class="order-details-container">
                        <!-- Order ID and Date -->
                        <div class="mb-3">
                            <div class="d-flex justify-content-between">
                                <span class="fw-semibold">Order ID:</span>
                                <span id="orderId">OR#0008</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span class="fw-semibold">Date:</span>
                                <span id="orderDate"></span>
                            </div>
                        </div>
                        <hr>
                        <!-- Customer Information -->
                        <div class="mb-3">
                            <h6 class="fw-bold">Customer Information
                                <i class="fas fa-user customer-info-icon" onclick="showCustomerForm()"></i>
                            </h6>
                            <div class="position-relative mb-2">
                                <input type="text" class="form-control customer-input" placeholder="Enter Phone Number" id="customerPhone">
                            </div>
                            <div class="mb-2">
                                <input type="text" class="form-control customer-input" placeholder="Customer Name" id="customerName">
                            </div>
                            <div class="mb-2">
                                <input type="email" class="form-control customer-input" placeholder="Customer Email" id="customerEmail">
                            </div>
                        </div>
                        <hr>
                        <!-- Selected Items -->
                        <div id="selectedItems">
                            <!-- Selected items will appear here -->
                        </div>
                    </div>
                    <!-- Total -->
                    <div class="mt-auto">
                        <hr>
                        <div class="d-flex justify-content-between fs-5 fw-bold">
                            <span>Total:</span>
                            <span id="totalAmount">LKR 0.00</span>
                        </div>
                        <button class="checkout-btn" onclick="processCheckout()">
                            <i class="fas fa-shopping-cart me-2"></i>Checkout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- JS -->
    <script src="js/order.js"></script>
    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
